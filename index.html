<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Táctico - Espectro Completo</title>
</head>
<body>
  
  <div id="map"></div>

  <div class="panel-control" style="position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.85); color: white; padding: 15px; border-radius: 8px; font-family: sans-serif; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 260px;">
    
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px;">
    <h3 style="margin: 0; font-size: 13px; color: #aaa; letter-spacing: 1px;">ESPECTRO TÁCTICO</h3>
    <button id="btn-minimizar" style="background: #222; border: 1px solid #555; color: #06b6d4; cursor: pointer; border-radius: 4px; padding: 2px 8px; font-size: 12px; font-family: monospace; font-weight: bold; transition: all 0.2s;">_</button>
  </div>
  
  <div id="panel-contenido" style="transition: max-height 0.3s ease-out; overflow: hidden;">
    
    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 13px; width: 100%;">
      <div style="display: flex; align-items: center;">
        <input type="checkbox" class="filtro-delito" value="Homicidio doloso" checked style="margin-right: 10px;">
        <span style="display: inline-block; width: 12px; height: 12px; background-color: #ff0055; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 6px #ff0055;"></span>
        Homicidios
      </div>
      <span style="color: #888; font-family: monospace; font-size: 12px;">5,354</span>
    </label>
    
    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 13px; width: 100%;">
      <div style="display: flex; align-items: center;">
        <input type="checkbox" class="filtro-delito" value="Secuestro" checked style="margin-right: 10px;">
        <span style="display: inline-block; width: 12px; height: 12px; background-color: #a855f7; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 6px #a855f7;"></span>
        Secuestros
      </div>
      <span style="color: #888; font-family: monospace; font-size: 12px;">142</span>
    </label>
    
    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 13px; width: 100%;">
      <div style="display: flex; align-items: center;">
        <input type="checkbox" class="filtro-delito" value="Feminicidio" checked style="margin-right: 10px;">
        <span style="display: inline-block; width: 12px; height: 12px; background-color: #ec4899; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 6px #ec4899;"></span>
        Feminicidios
      </div>
      <span style="color: #888; font-family: monospace; font-size: 12px;">201</span>
    </label>
    
    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 13px; width: 100%;">
      <div style="display: flex; align-items: center;">
        <input type="checkbox" class="filtro-delito" value="Extorsion" checked style="margin-right: 10px;">
        <span style="display: inline-block; width: 12px; height: 12px; background-color: #f97316; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 6px #f97316;"></span>
        Extorsión
      </div>
      <span style="color: #888; font-family: monospace; font-size: 12px;">3,428</span>
    </label>
    
    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 13px; width: 100%;">
      <div style="display: flex; align-items: center;">
        <input type="checkbox" class="filtro-delito" value="Robo" checked style="margin-right: 10px;">
        <span style="display: inline-block; width: 12px; height: 12px; background-color: #eab308; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 6px #eab308;"></span>
        Robos
      </div>
      <span style="color: #888; font-family: monospace; font-size: 12px;">141,211</span>
    </label>
    
    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 13px; width: 100%;">
      <div style="display: flex; align-items: center;">
        <input type="checkbox" class="filtro-delito" value="Narcomenudeo" checked style="margin-right: 10px;">
        <span style="display: inline-block; width: 12px; height: 12px; background-color: #22c55e; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 6px #22c55e;"></span>
        Narcomenudeo
      </div>
      <span style="color: #888; font-family: monospace; font-size: 12px;">34,045</span>
    </label>
    
    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 13px; width: 100%;">
      <div style="display: flex; align-items: center;">
        <input type="checkbox" class="filtro-delito" value="Delitos Sexuales" checked style="margin-right: 10px;">
        <span style="display: inline-block; width: 12px; height: 12px; background-color: #3b82f6; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 6px #3b82f6;"></span>
        Delitos Sexuales
      </div>
      <span style="color: #888; font-family: monospace; font-size: 12px;">23,823</span>
    </label>
    
    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; cursor: pointer; font-size: 13px; width: 100%;">
      <div style="display: flex; align-items: center;">
        <input type="checkbox" class="filtro-delito" value="Otros Delitos" checked style="margin-right: 10px;">
        <span style="display: inline-block; width: 12px; height: 12px; background-color: #94a3b8; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 6px #94a3b8;"></span>
        Otros Delitos
      </div>
      <span style="color: #888; font-family: monospace; font-size: 12px;">437,810</span>
    </label>

    <div style="border-top: 1px dotted #555; padding-top: 10px; font-size: 11px; color: #888; line-height: 1.4;">
      <strong>MÉTRICA:</strong><br>
      La "Intensidad" representa el volumen total acumulado de crímenes por municipio (Total: 646,014 casos). Datos oficiales del SESNSP enero-abril 2026
    </div>
  </div>
</div>

  <div style="position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.85); color: white; padding: 10px; border-radius: 8px; font-family: sans-serif; border: 1px solid #333;">
    <label style="cursor: pointer; margin-right: 10px;">
      <input type="radio" name="map-mode" value="tactico" checked> Vista Táctica
    </label>
    <label style="cursor: pointer;">
      <input type="radio" name="map-mode" value="calor"> Mapa de Calor
    </label>
  </div>

  <div id="hud" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(0,0,0,0.9); color: white; padding: 15px 30px; border-radius: 4px; font-family: monospace; text-align: center; border: 1px solid #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);">
    <div id="hud-region" style="font-size: 18px; font-weight: bold; letter-spacing: 2px;">MÉXICO (VISTA GENERAL)</div>
    <div id="hud-status" style="font-size: 14px; color: #aaa; margin-top: 5px;">
        MONITOREO ACTIVO POR <a href="https://www.facebook.com/randomxmx" target="_blank" style="color: #06b6d4; text-decoration: none; font-weight: bold; cursor: pointer;">RANDOMXMX</a>
    </div>
</div>

  <script type="module" src="/main.js"></script>

</body>

  </a>

</div>

</html>
